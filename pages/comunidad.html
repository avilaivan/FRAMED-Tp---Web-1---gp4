<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Framed | Comunidad</title>
    <link rel="shortcut icon" href="../img/favicon - framed.png" type="image/x-icon" />
    <link rel="stylesheet" href="../style/style.css" />
    <link rel="stylesheet" href="../style/comunidad.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <main>
        <section class="hero-carrusel">
            <div class="resenias-titulo hero-titulo">
                <h2>Películas recomendadas por la comunidad</h2>
            </div>
            <div class="carrusel-wrapper">
                <button class="btn-carrusel prev" id="btn-prev-carrusel"><i class="fa-solid fa-chevron-left"></i></button>
                <div class="carrusel-track-container">
                    <div class="carrusel-track" id="carrusel-track"></div>
                </div>
                <button class="btn-carrusel next" id="btn-next-carrusel"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </section>

        <div class="contenido-principal">
            <section class="columna-principal">

                <section class="resenias" id="resenias-container">
                    <div class="resenias-titulo">
                        <h2>Reseñas de la Comunidad</h2>
                    </div>
                    <div class="resenias-header">
                        <button id="btn-recientes" class="btn-filtro activo" style="pointer-events: none; border-color: #68ff8f; color: #68ff8f;">Más Recientes</button>
                    </div>
                </section>

                <div id="categorias-comunidad">
                    </div>

            </section>

            <div class="sidebar">
                <aside class="buscador-aside">
                    <div class="widget buscador-widget">
                        <div class="input-icono">
                            <i class="fa-solid fa-search"></i>
                            <input type="text" id="input-busqueda" placeholder="Buscar usuarios...">
                        </div>
                        <div class="resultados-busqueda" id="resultados-busqueda"></div>
                    </div>
                </aside>
            </div>
        </div>
    </main>
    <script type="module" src="../script/script-pages.js"></script>
</body>
</html>
