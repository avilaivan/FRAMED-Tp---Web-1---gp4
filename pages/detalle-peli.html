<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framed | Detalle de película</title>
    <link rel="shortcut icon" href="../img/favicon - framed.png" type="image/x-icon" />
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <main>
        <section class="detalle-peli-container">
            <div class="columna-video-detalle">
                <video id="video-fondo" autoplay muted loop preload="metadata">
                    Tu navegador no soporta la reproducción de video.
                </video>
                <div class="info-pelicula">
                    <img id="peli-portada" src="" alt="Portada" class="portada-img">
                    <div class="texto-info">
                        <h1 id="peli-titulo">Cargando...</h1>
                        <h4 id="peli-info">Cargando...</h4>
                        <div class="puntaje" id="peli-puntaje"></div>
                        <p id="peli-sinopsis">Cargando sinopsis...</p>
                        <h4 id="peli-elenco"></h4>
                        <h4 id="peli-director"></h4>
                        
                        <div class="contenedor-acciones">
                            <button class="btn-interaccion-img btn-requiere-sesion" id="btn-like-peli" title="Me gusta">
                                <img src="../img/LIKE.png" alt="Me gusta">
                            </button>
                            <button class="btn-interaccion-img btn-requiere-sesion" id="btn-guardar-peli" title="Añade a tus favoritos">
                                <img src="../img/AGREGAR.png" alt="Ver más tarde">
                            </button>
                            <button class="btn-interaccion-img btn-requiere-sesion" id="btn-abrir-resena-modal" title="Haz tu reseña">
                                <img src="../img/ICON RESENIA.png" alt="Haz tu reseña">
                            </button>
                        </div>

                        <div class="contenedor-plataformas">
                            <h5>Disponible en:</h5>
                            <a href="https://www.netflix.com" target="_blank" rel="noopener noreferrer">
                                <img src="../img/NETFLIX.png" alt="Netflix">
                            </a>
                            <a href="https://www.max.com" target="_blank" rel="noopener noreferrer">
                                <img src="../img/HBO.png" alt="HBO">
                            </a>
                            <a href="https://www.disneyplus.com" target="_blank" rel="noopener noreferrer">
                                <img src="../img/DISNEY.png" alt="Disney+">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="comentarios-seccion">
            <div class="columna-comentarios2" id="contenedor-comentarios-listado">
                <h2>Últimas Reseñas</h2>
            </div>
        </section>

        <div id="modal-crear-resena-peli" class="modal-overlay oculto">
            <div class="modal-contenido">
                <h2>Nueva Reseña</h2>
                <div class="seccion-estrellas-rating" style="margin: 1rem 0; display: flex; gap: 0.5rem; justify-content: center; font-size: 2rem;">
                    <i class="fa-regular fa-star star-click" data-value="1" style="color: #68ff8f; cursor: pointer;"></i>
                    <i class="fa-regular fa-star star-click" data-value="2" style="color: #68ff8f; cursor: pointer;"></i>
                    <i class="fa-regular fa-star star-click" data-value="3" style="color: #68ff8f; cursor: pointer;"></i>
                    <i class="fa-regular fa-star star-click" data-value="4" style="color: #68ff8f; cursor: pointer;"></i>
                    <i class="fa-regular fa-star star-click" data-value="5" style="color: #68ff8f; cursor: pointer;"></i>
                </div>
                <div class="seccion-input">
                    <label for="textarea-nueva-resena">Tu opinión sobre la película:</label>
                    <textarea id="textarea-nueva-resena" rows="4" placeholder="Contale a la comunidad qué te pareció..."></textarea>
                </div>
                <div class="modal-botones">
                    <button class="btn-cancelar" id="btn-cancelar-resena-modal">Cancelar</button>
                    <button class="btn-guardar" id="btn-publicar-resena-peli">Publicar Reseña</button>
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="../script/detalle-peli.js"></script>
</body>
</html>
