<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framed | Mi Perfil</title>
    <link rel="shortcut icon" href="../img/favicon - framed.png" type="image/x-icon" />
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <main>

        <!-- INFO DEL USUARIO -->
        <section class="contenedor-perfil">
            <div class="informacion-perfil">
                <div class="foto-perfil">
                    <img src="../img/perfil prueba.png" alt="foto perfil" id="img-perfil-main">
                </div>
                <div class="descripcion-perfil">
                    <h2 id="nombre-perfil-main">Usuario123</h2>
                    <h3 id="usuario-perfil-main">@usuario123</h3>
                    <p id="bio-perfil-main">Cinéfilo apasionado. Escribiendo mis pensamientos sobre cada fotograma.</p>
                </div>
            </div>
            <div class="opciones-perfil">
                <div class="botones-container">
                    <button class="btn-editar" id="btn-editar-perfil">Editar Perfil</button>
                    <div class="dropdown">
                        <button class="btn-mas">Más</button>
                        <div class="dropdown-content">
                            <a href="#">Cambiar contraseña</a>
                            <a href="#" id="btn-cerrar-sesion-perfil">Cerrar sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- LAYOUT PRINCIPAL (columna única, sin sidebar de grupos) -->
        <div class="perfil-layout" style="grid-template-columns: 1fr;">
            <main class="perfil-main">

                <!-- RESEÑA DESTACADA -->
                <section class="bloque-seccion">
                    <div class="header-con-boton">
                        <h2 class="titulo-seccion">Reseña Destacada</h2>
                        <button class="btn-editar" id="btn-cambiar-fijada">Cambiar</button>
                    </div>
                    <div id="contenedor-resena-fijada"></div>
                </section>

                <!-- MIS ME GUSTA -->
                <section class="bloque-seccion">
                    <h2 class="titulo-seccion">Mis "Me Gusta"</h2>
                    <div class="grid-listas-reducida" id="grid-megustas"></div>
                </section>

                <!-- VER MÁS TARDE -->
                <section class="bloque-seccion">
                    <h2 class="titulo-seccion">Ver más tarde</h2>
                    <div class="grid-listas-reducida" id="grid-guardados"></div>
                </section>

            </main>
        </div>

        <!-- MODALES -->

        <!-- 1. EDITAR PERFIL -->
        <div id="modal-editar-perfil" class="modal-overlay oculto">
            <div class="modal-contenido">
                <h2>Editar Perfil</h2>
                <div class="seccion-avatar">
                    <p>Elegí tu avatar:</p>
                    <div class="opciones-avatar">
                        <img src="../img/perfil prueba.png" alt="Avatar 1" class="avatar-opcion activo">
                        <img src="../img/avatar2.png"       alt="Avatar 2" class="avatar-opcion">
                        <img src="../img/batman.png"        alt="Avatar 3" class="avatar-opcion">
                    </div>
                </div>
                <div class="seccion-input">
                    <label for="input-nombre">Nombre a mostrar:</label>
                    <input type="text" id="input-nombre" placeholder="Ej: Valen Himitian" maxlength="30">
                </div>
                <div class="seccion-input">
                    <label for="input-bio">Descripción de tu perfil:</label>
                    <textarea id="input-bio" rows="3" maxlength="150" placeholder="Escribí algo sobre vos..."></textarea>
                </div>
                <div class="modal-botones">
                    <button class="btn-cancelar btn-cerrar-modal">Cancelar</button>
                    <button class="btn-guardar" id="btn-guardar-perfil">Guardar Cambios</button>
                </div>
            </div>
        </div>

        <!-- 2. VER LISTA COMPLETA -->
        <div id="modal-ver-lista" class="modal-overlay oculto">
            <div class="modal-contenido modal-largo">
                <h2 id="titulo-modal-lista">Mi Lista</h2>
                <div class="grid-lista-completa" id="contenedor-lista-completa"></div>
                <div class="modal-botones">
                    <button class="btn-cancelar btn-cerrar-modal">Cerrar</button>
                </div>
            </div>
        </div>

        <!-- 3. CAMBIAR RESEÑA FIJADA -->
        <div id="modal-cambiar-resena" class="modal-overlay oculto">
            <div class="modal-contenido modal-largo">
                <h2>Elegir Reseña Destacada</h2>
                <div class="lista-mis-resenas" id="contenedor-mis-resenas"></div>
                <div class="modal-botones">
                    <button class="btn-cancelar btn-cerrar-modal">Cancelar</button>
                </div>
            </div>
        </div>

    </main>
    <script type="module" src="../script/script-pages.js"></script>
</body>
</html>
